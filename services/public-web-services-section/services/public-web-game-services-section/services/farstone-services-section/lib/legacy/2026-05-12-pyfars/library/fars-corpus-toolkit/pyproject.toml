[project]
name = "fars"
version = "0.1.0"
description = "Pythonic FARS — flatfile-agentic-resource-system: substrate, operators, closure-rule system, and runtime scaffolding for a predication-graph-shaped flatfile corpus."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
fars = "fars.cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
