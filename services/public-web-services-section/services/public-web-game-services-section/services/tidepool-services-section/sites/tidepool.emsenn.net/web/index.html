<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tidepool</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4efe6;
    --fg: #26221c;
    --dim: #6b6255;
    --line: #d8cfbe;
    --accent: #0d6b5e;
    --both: #a3401f;
    --panel: #fffaf1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --fg: #e7e2d6;
      --dim: #8d8a7f;
      --line: #33332c;
      --accent: #5fd1bd;
      --both: #e08a5c;
      --panel: #1b1e1a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: 0.03em; }
  header .theme-toggle {
    background: none; border: 1px solid var(--line); color: var(--fg);
    border-radius: 4px; padding: 0.2rem 0.5rem; cursor: pointer; font: inherit;
  }
  #conn { color: var(--dim); font-size: 0.85rem; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(220px, 1fr);
    gap: 1px;
    background: var(--line);
    overflow: hidden;
  }
  section { background: var(--panel); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  #log-pane { min-height: 0; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 0.9rem 1rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log .entry { margin: 0 0 0.9rem 0; }
  #log .place-name { color: var(--accent); font-weight: 600; }
  #log .system { color: var(--fg); }
  #log .speech { color: var(--fg); }
  #log .emote, #log .signal, #log .rumor, #log .governance { color: var(--dim); font-style: italic; }
  #log .echo { color: var(--dim); }
  form#cmd {
    display: flex;
    border-top: 1px solid var(--line);
    padding: 0.6rem 1rem;
    gap: 0.5rem;
  }
  form#cmd input {
    flex: 1;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.45rem 0.6rem;
    font: inherit;
  }
  form#cmd input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #side { padding: 0.9rem 1rem; overflow-y: auto; }
  #side h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 1rem 0 0.4rem; }
  #side h2:first-child { margin-top: 0; }
  #clock-line { color: var(--dim); font-size: 0.85rem; }
  #occupants, #affordances { list-style: none; margin: 0; padding: 0; }
  #occupants li, #affordances li { padding: 0.15rem 0; }
  #affordances li { color: var(--accent); }
  .subject-block { border-top: 1px dashed var(--line); padding-top: 0.5rem; margin-top: 0.5rem; }
  .subject-id { color: var(--dim); font-size: 0.8rem; }
  .cell-both { color: var(--both); }
  .exits { color: var(--dim); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>Tidepool</h1>
  <span id="conn">connecting…</span>
  <button id="theme-toggle" class="theme-toggle" type="button" title="Cycle theme (system / light / dark)">theme</button>
</header>
<main>
  <section id="log-pane">
    <div id="log"></div>
    <form id="cmd" autocomplete="off">
      <input id="cmd-input" type="text" placeholder="look" autofocus spellcheck="false" />
    </form>
  </section>
  <section id="side">
    <h2>Place</h2>
    <div id="place-name">—</div>
    <div id="exits" class="exits"></div>
    <h2>Clock</h2>
    <div id="clock-line">—</div>
    <h2>Here</h2>
    <ul id="occupants"></ul>
    <h2>You can</h2>
    <ul id="affordances"></ul>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
