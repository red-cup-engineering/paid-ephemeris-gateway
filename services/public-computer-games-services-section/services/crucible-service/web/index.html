<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crucible.561.group</title>
<meta name="description" content="A daily-seeded puzzle where every move's energy cost is the real obstruction mathematics (H1 rank, settling depth, regime) of @lenticule-science/metrologic — not a designer spreadsheet.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/shelf-chrome.css">
<script type="importmap">
{
  "imports": {
    "@lenticule-science/metrologic/obstruction/settling": "/vendor/lenticule-science-metrologic/obstruction/src/settling.mjs",
    "@lenticule-science/metrologic/obstruction/cochain": "/vendor/lenticule-science-metrologic/obstruction/src/cochain.mjs",
    "@lenticule-science/metrologic/bilattice": "/vendor/lenticule-science-metrologic/bilattice/src/index.mjs"
  }
}
</script>
</head>
<body>
<header class="site-header">
  <svg class="shelf-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
    <ellipse cx="24" cy="24" rx="18" ry="11"/>
    <path d="M13 17q11-6 22 0" stroke-width="1.3" opacity="0.6"/>
    <path d="M11 24 14.25 21.5 17.5 24 20.75 21.5 24 24 27.25 21.5 30.5 24 33.75 21.5 37 24"/>
  </svg>
  <span class="site-title">crucible.561.group</span>
  <span class="spacer"></span>
  <span class="seed-badge">seed: <code id="seed-label"></code></span>
  <button id="btn-theme" class="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
</header>

<main class="play-main">
  <section class="lattice-section">
    <svg id="lattice" class="lattice-svg" aria-label="The crucible lattice"></svg>
    <div id="status-panel" class="status-panel" aria-live="off"></div>
  </section>

  <aside class="side-panel">
    <div class="energy-row">
      <span>Energy spent</span>
      <strong id="energy-label">0 / 0 wits</strong>
    </div>
    <div class="history-row">
      <button id="btn-undo" class="history-button" type="button" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="btn-redo" class="history-button" type="button" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">↷ Redo</button>
    </div>
    <h2>Legal moves</h2>
    <div id="move-panel" class="move-panel"></div>
    <div id="history-panel" class="history-panel"></div>
  </aside>
</main>

<footer class="site-footer">
  Cost is computed by <code>@lenticule-science/metrologic/obstruction</code> — literal H¹ rank, settling depth,
  and regime, not a designer spreadsheet. See <code>DESIGN.md</code> in this service.
  <p class="shelf-footer-line">
    <svg class="shelf-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
      <ellipse cx="24" cy="24" rx="18" ry="11"/>
      <path d="M13 17q11-6 22 0" stroke-width="1.3" opacity="0.6"/>
      <path d="M11 24 14.25 21.5 17.5 24 20.75 21.5 24 24 27.25 21.5 30.5 24 33.75 21.5 37 24"/>
    </svg>
    Part of the <a href="https://play.561.group">561 shelf</a>.
  </p>
</footer>

<div id="aria-live" role="status" aria-live="polite" class="sr-only"></div>

<script type="module" src="js/app.mjs"></script>
<script type="module">
  const btn = document.getElementById('btn-theme');
  const apply = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  const label = () => (document.documentElement.dataset.theme === 'dark' ? '☀️ Light' : '🌙 Dark');
  apply(localStorage.getItem('crucible-theme'));
  btn.textContent = label();
  btn.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? null : 'dark';
    apply(next);
    if (next) localStorage.setItem('crucible-theme', next); else localStorage.removeItem('crucible-theme');
    btn.textContent = label();
  });
</script>
</body>
</html>
